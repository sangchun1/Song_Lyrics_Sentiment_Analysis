# configs/eval.yaml (recommended defaults)
# Dev-friendly defaults for fast iteration on 500k-scale data.
# - If you want final reporting runs, bump n_queries to 500~800 or more.

eval:
  seed: 42
  n_queries: 300
  k_values: [5, 10, 20]

  query_sampling:
    stratify_by: [genre]
    min_per_stratum: 10

pseudo_ground_truth:
  year_window: 10
  require_same_genre: true
  exclude_same_song: true
  exclude_same_artist: true

  graded_relevance:
    enabled: true
    grade_if_same_genre_and_within_year: 2
    grade_if_same_genre_only: 0
    max_grade1_per_query: 0

metrics:
  recall:
    enabled: true

  ndcg:
    enabled: true

  emotion_consistency:
    enabled: true
    representation: emotion_ratio_vad
    similarity: cosine
    threshold: null

  ild:
    enabled: true
    distance: "1-cosine"

outputs:
  table_name: main_results
  per_query_name: per_query_metrics
