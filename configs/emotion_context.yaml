# configs/emotion_context.yaml
# Emotion Context Vector (Proposed) configuration
# Main vector layout:
#   z(s) = [embedding | emotion_ratio(6) | vad(3)]
# Optional extended layout for ablation:
#   z_ext(s) = [embedding | emotion_ratio(6) | intensity(6) | vad(3)]

embedder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: auto                # auto | cpu | cuda
  batch_size: 64
  normalize_embeddings: true
  max_length: 256

text:
  embedding_text_col: lyrics_dedup
  lexicon_text_col: lyrics_clean
  fallback_embedding_text_col: lyrics_clean
  fallback_lexicon_text_col: lyrics_dedup
  line_split: newline         # newline | sentence
  keep_original_for_lexicon: true
  dedup_for_embedding: true
  strip_brackets: true
  min_line_chars: 3
  max_lines_per_song: 250

emotion:
  emotions: [anger, fear, joy, sadness, disgust, trust]
  nrc_lexicon_file: assets/lexicons/nrc_lexicon.txt

intensity:
  enabled: true
  nrc_intensity_file: assets/lexicons/nrc_intensity.txt
  aggregation: mean           # mean | sum

vad:
  enabled: true
  vad_lexicon_file: assets/lexicons/vad_lexicon.txt
  aggregation: mean           # mean | sum

line_weighting:
  alpha_emotion: 1.0
  beta_intensity: 0.5
  gamma_arousal: 0.25
  normalize: softmax          # none | l1 | softmax
  softmax_temperature: 1.0

aggregation:
  method: weighted_mean       # weighted_mean | mean
  vector_layout: embedding_ratio_vad   # embedding_ratio_vad | embedding_ratio_intensity_vad
  include_vad: true
  include_intensity_tail: false
  song_feature_weight: emotion_word_count
  min_emotion_word_count: 1

outputs:
  song_vector_name: emotion_context_vectors
  line_feature_name: emotion_context_line_features
  save_line_features: false

runtime:
  song_batch_size: 512
