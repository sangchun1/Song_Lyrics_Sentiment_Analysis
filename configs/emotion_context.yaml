# configs/emotion_context.yaml
# Emotion Context Vector (Proposed) configuration
# - Builds line-level embeddings + emotion/intensity/VAD features
# - Aggregates into a song-level emotion-context vector z(s)

embedder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: auto              # auto | cpu | cuda
  batch_size: 64
  normalize_embeddings: true
  max_length: 256           # tokenizer max length (truncate longer lines)

text:
  line_split: newline        # newline | sentence
  keep_original_for_lexicon: true
  dedup_for_embedding: true  # remove repeated chorus/duplicate lines for embedding only
  strip_brackets: true       # remove [Chorus], [Verse] tags if present
  min_line_chars: 3
  max_lines_per_song: 250

emotion:
  # Compact 6-emotion profile (baseline-aligned)
  emotions: [anger, fear, joy, sadness, disgust, trust]
  nrc_lexicon_file: assets/lexicons/nrc_lexicon.txt

intensity:
  enabled: true
  nrc_intensity_file: assets/lexicons/nrc_intensity.txt
  aggregation: mean          # mean | sum | max
  clamp_min: 0.0
  clamp_max: 1.0

vad:
  enabled: true
  vad_lexicon_file: assets/lexicons/vad_lexicon.txt
  aggregation: mean          # mean | sum | max
  clamp_min: -1.0
  clamp_max: 1.0

line_weighting:
  alpha_emotion: 1.0
  beta_intensity: 1.0
  gamma_arousal: 1.0
  normalize: softmax         # none | l1 | softmax
  softmax_temperature: 1.0

aggregation:
  method: weighted_mean      # weighted_mean | mean
  min_emotion_word_count: 1

outputs:
  song_vector_name: emotion_context_vectors
  line_feature_name: emotion_context_line_features
