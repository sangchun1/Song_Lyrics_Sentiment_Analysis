[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrics-reco"
version = "0.1.0"
description = "Lyrics-based emotion context vector music recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [{ name = "Sangchun Park" }]

dependencies = [
  # Core
  "numpy>=1.23",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pyarrow>=14.0",
  "joblib>=1.3",

  # Text preprocessing / utilities
  "regex>=2023.12.25",
  "ftfy>=6.1.3",
  "langdetect>=1.0.9",
  "fasttext-wheel>=0.9.2",

  # Embeddings (Hugging Face / Sentence-Transformers)
  "torch>=2.1",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  "accelerate>=0.30",

  # Vector DB (Chroma)
  "chromadb>=0.5",

  # Experiment tracking
  "wandb>=0.17",

  # Optional (nice-to-have)
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.4",
  "mypy>=1.8",
  "types-PyYAML>=6.0.12",
  "ipykernel>=6.29",
  "jupyter>=1.0",
  "pre-commit>=3.7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]